name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Node tests
        run: node --test --test-isolation=none tests/*.test.mjs
      - name: Install isolated lint tools
        run: npm ci --prefix tools/lint
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
