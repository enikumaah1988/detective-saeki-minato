<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">S08 三状態比較図 第2版・未採用</title><desc id="desc">旧図面、現行図面、現場観察の各平面図で南入口と設備室A/Bの位置を固定し、通路・壁・遮蔽物を描き分けた仮モック。現場観察だけに同形のA・B・C確認地点を表示する。実際の建築図面ではない。</desc>
<style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#e7edf5}.title{font-size:26px;font-weight:700}.panel-title{font-size:23px;font-weight:700}.small{font-size:15px;fill:#b9c7d6}.roomtext{font-size:15px;fill:#eff3f7}.thin{stroke:#61768b;stroke-width:1}.wall{stroke:#b5c4d5;stroke-width:7;stroke-linecap:square;fill:none}.door{stroke:#79afbf;stroke-width:5;stroke-linecap:round;fill:none}.pin{fill:#263648;stroke:#d1dbe5;stroke-width:2.5}.pintext{font-size:18px;font-weight:700;fill:#f0f5fc}.shade{fill:#314456;stroke:#7c92a8;stroke-width:2}.walk{fill:#263f4a}</style>
<rect width="1440" height="820" fill="#101c29"/><text x="22" y="46" class="title">S08｜旧分岐の確認位置を推定する — 図面比較 v2</text><text x="22" y="73" class="small">3資料で通路入口・設備室の扉位置を固定。候補は「管理者に確認を依頼する地点」であり、現在の隠し入口を示さない。</text><rect x="22" y="98" width="452" height="652" rx="15" fill="#1d2b3a" stroke="#41576a" stroke-width="2"/><text x="44" y="136" class="panel-title">① 改修前図面</text><text x="44" y="162" class="small">S07｜旧平面図</text><text x="374" y="192" class="small">北 ↑</text><rect x="308" y="363" width="136" height="58" rx="2" class="shade"/><text x="375" y="397" text-anchor="middle" class="roomtext">設備室B</text><rect x="308" y="443" width="136" height="58" rx="2" class="shade"/><text x="375" y="477" text-anchor="middle" class="roomtext">設備室A</text><rect x="232" y="225" width="76" height="385" class="walk"/><path class="wall" d="M 308 225 V 376 M 308 408 V 456 M 308 488 V 610"/><path class="door" d="M 308 377 L 323 377"/><path class="thin" d="M 308 377 Q 325 392 308 407" fill="none"/><path class="door" d="M 308 457 L 323 457"/><path class="thin" d="M 308 457 Q 325 472 308 487" fill="none"/><rect x="235" y="608" width="70" height="37" rx="5" fill="#31495b" stroke="#7796aa" stroke-width="2"/><text x="270" y="632" text-anchor="middle" class="small">南入口</text><rect x="135" y="293" width="97" height="37" class="walk"/><rect x="72" y="257" width="70" height="108" class="shade"/><text x="107" y="304" text-anchor="middle" class="roomtext">旧倉庫</text><text x="107" y="323" text-anchor="middle" class="small">（当時）</text><path class="wall" d="M 232 225 V 293 M 232 330 V 610 M 135 293 H 232 M 135 330 H 232"/><path class="wall" d="M 232 225 H 308"/><text x="67" y="404" class="small">幅のある旧枝通路</text><path d="M 46 672 H 450" class="thin"/><rect x="51" y="691" width="18" height="12" class="walk"/><text x="77" y="704" class="small">通路</text><path d="M 175 697 H 200" class="wall"/><text x="208" y="704" class="small">壁面</text><rect x="322" y="691" width="18" height="12" class="shade"/><text x="350" y="704" class="small">設備・室</text><rect x="492" y="98" width="452" height="652" rx="15" fill="#1d2b3a" stroke="#41576a" stroke-width="2"/><text x="514" y="136" class="panel-title">② 現行管理図面</text><text x="514" y="162" class="small">S05｜現在の管理図面</text><text x="844" y="192" class="small">北 ↑</text><rect x="778" y="363" width="136" height="58" rx="2" class="shade"/><text x="845" y="397" text-anchor="middle" class="roomtext">設備室B</text><rect x="778" y="443" width="136" height="58" rx="2" class="shade"/><text x="845" y="477" text-anchor="middle" class="roomtext">設備室A</text><rect x="702" y="225" width="76" height="385" class="walk"/><path class="wall" d="M 778 225 V 376 M 778 408 V 456 M 778 488 V 610"/><path class="door" d="M 778 377 L 793 377"/><path class="thin" d="M 778 377 Q 795 392 778 407" fill="none"/><path class="door" d="M 778 457 L 793 457"/><path class="thin" d="M 778 457 Q 795 472 778 487" fill="none"/><rect x="705" y="608" width="70" height="37" rx="5" fill="#31495b" stroke="#7796aa" stroke-width="2"/><text x="740" y="632" text-anchor="middle" class="small">南入口</text><path class="wall" d="M 702 246 V 610 M 702 246 H 778"/><rect x="707" y="224" width="67" height="18" fill="#1d2b3a"/><text x="526" y="305" class="small">旧枝通路の記載なし</text><text x="526" y="327" class="small">奥側は簡略化</text><path d="M 516 672 H 920" class="thin"/><rect x="521" y="691" width="18" height="12" class="walk"/><text x="547" y="704" class="small">通路</text><path d="M 645 697 H 670" class="wall"/><text x="678" y="704" class="small">壁面</text><rect x="792" y="691" width="18" height="12" class="shade"/><text x="820" y="704" class="small">設備・室</text><rect x="962" y="98" width="452" height="652" rx="15" fill="#1d2b3a" stroke="#41576a" stroke-width="2"/><text x="984" y="136" class="panel-title">③ 現場観察</text><text x="984" y="162" class="small">S06｜現地で確認した範囲</text><text x="1314" y="192" class="small">北 ↑</text><rect x="1248" y="363" width="136" height="58" rx="2" class="shade"/><text x="1315" y="397" text-anchor="middle" class="roomtext">設備室B</text><rect x="1248" y="443" width="136" height="58" rx="2" class="shade"/><text x="1315" y="477" text-anchor="middle" class="roomtext">設備室A</text><rect x="1172" y="225" width="76" height="385" class="walk"/><path class="wall" d="M 1248 225 V 376 M 1248 408 V 456 M 1248 488 V 610"/><path class="door" d="M 1248 377 L 1263 377"/><path class="thin" d="M 1248 377 Q 1265 392 1248 407" fill="none"/><path class="door" d="M 1248 457 L 1263 457"/><path class="thin" d="M 1248 457 Q 1265 472 1248 487" fill="none"/><rect x="1175" y="608" width="70" height="37" rx="5" fill="#31495b" stroke="#7796aa" stroke-width="2"/><text x="1210" y="632" text-anchor="middle" class="small">南入口</text><path class="wall" d="M 1172 288 V 610 M 1172 288 H 1248"/><rect x="1177" y="224" width="67" height="59" fill="#1d2b3a"/><rect x="1126" y="281" width="57" height="75" rx="5" fill="#3d5061" stroke="#8ba0b3" stroke-width="2"/><path d="M 1133 290 L 1174 346 M 1174 290 L 1133 346" stroke="#8499ae" stroke-width="2"/><text x="1153" y="375" text-anchor="middle" class="small">設備</text><circle cx="1199" cy="559" r="16" class="pin"/><text x="1199" y="565" text-anchor="middle" class="pintext">A</text><circle cx="1199" cy="343" r="16" class="pin"/><text x="1199" y="349" text-anchor="middle" class="pintext">B</text><circle cx="1226" cy="508" r="16" class="pin"/><text x="1226" y="514" text-anchor="middle" class="pintext">C</text><text x="992" y="399" class="small">設備の奥は未確認</text><path d="M 986 672 H 1390" class="thin"/><rect x="991" y="691" width="18" height="12" class="walk"/><text x="1017" y="704" class="small">通路</text><path d="M 1115 697 H 1140" class="wall"/><text x="1148" y="704" class="small">壁面</text><rect x="1262" y="691" width="18" height="12" class="shade"/><text x="1290" y="704" class="small">設備・室</text><text x="22" y="783" class="small">注：壁厚・距離は模式上の仮値。現場で隠れた入口が見える表現や、旧倉庫の現存を確定する描写はしていない。</text></svg>