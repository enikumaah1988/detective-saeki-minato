<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img"><title>S08｜制作者向け・通行構造の検証案 v3</title><desc>未採用・ネタバレ資料：橙の点線は仮の通行経路。寸法・設備安全・法令適合は未検証。</desc><style>text{font-family:"Noto Sans JP","Yu Gothic",sans-serif;fill:#e8f1f5}.ttl{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.cap{font-size:15px;fill:#b9ceda}.tiny{font-size:13px;fill:#b9ceda}.walk{fill:#2f5057}.room{fill:#354c60;stroke:#a8c0cc;stroke-width:2}.wall{fill:none;stroke:#d6e4ec;stroke-width:6;stroke-linecap:square}.door{fill:none;stroke:#b2cfd4;stroke-width:3}.pin{fill:#26394a;stroke:#dceaf0;stroke-width:2.5}.pint{font-size:17px;font-weight:700}.equip{fill:#746f68;stroke:#ccbca3;stroke-width:2}.ghost{fill:#1d303d;stroke:#536b78;stroke-width:2;stroke-dasharray:6 5}.route{fill:none;stroke:#e6ba76;stroke-width:4;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1440" height="830" fill="#111f2a"/><text x="25" y="42" class="ttl">S08｜制作者向け・通行構造の検証案 v3</text><text x="25" y="70" class="cap">未採用・ネタバレ資料：橙の点線は仮の通行経路。寸法・設備安全・法令適合は未検証。</text><g transform="translate(20 100)"><rect x="0" y="0" width="448" height="660" rx="16" fill="#1c2e3c" stroke="#476276" stroke-width="2"/><text x="18" y="35" class="head">① 旧図面の接続</text><text x="18" y="59" class="tiny">北 ↑　西 ←　東 →</text><rect class="walk" x="218" y="160" width="76" height="408"/><rect class="walk" x="108" y="275" width="110" height="48"/><rect class="room" x="30" y="242" width="83" height="112" rx="4"/><text x="71" y="302" text-anchor="middle" class="cap">旧倉庫</text><path class="wall" d="M218 160 V275 M218 323 V568 M108 275 H218 M108 323 H218 M218 160 H294 M113 242 V285 M113 317 V354"/><path class="door" d="M113 285 Q130 300 113 317"/><rect class="room" x="294" y="355" width="128" height="70" rx="4"/><text x="357" y="395" text-anchor="middle" class="cap">設備室B</text><rect class="room" x="294" y="435" width="128" height="70" rx="4"/><text x="357" y="476" text-anchor="middle" class="cap">設備室A</text><path class="wall" d="M294 160 V375 M294 405 V455 M294 485 V568"/><path class="door" d="M294 375 Q310 390 294 405 M294 455 Q310 470 294 485"/><rect x="219" y="558" width="73" height="35" rx="4" fill="#426475" stroke="#a5bfca" stroke-width="2"/><text x="256" y="581" text-anchor="middle" class="tiny">南入口</text><path d="M16 618 H432" stroke="#4e6878"/><text x="16" y="643" class="tiny">現地確認の位置を考える資料</text></g><g transform="translate(495 100)"><rect x="0" y="0" width="448" height="660" rx="16" fill="#1c2e3c" stroke="#476276" stroke-width="2"/><text x="18" y="35" class="head">② 現場の想定構造（内部用）</text><text x="18" y="59" class="tiny">北 ↑　西 ←　東 →</text><rect class="walk" x="218" y="270" width="76" height="298"/><rect class="walk" x="113" y="275" width="105" height="48"/><rect class="room" x="30" y="242" width="83" height="112" rx="4"/><text x="71" y="302" class="cap" text-anchor="middle">旧倉庫</text><path class="wall" d="M218 160 V275 M218 323 V568 M259 270 H294 M113 275 H218 M113 323 H218 M113 242 V285 M113 317 V354"/><path class="door" d="M113 285 Q130 300 113 317"/><rect class="equip" x="237" y="265" width="26" height="72" rx="4"/><path class="route" d="M255 541 L230 353 L230 303 L153 303 L122 303"/><circle cx="230" cy="343" r="5" fill="#e6ba76"/><text x="16" y="405" class="tiny">設備の南から西寄りへ</text><text x="16" y="426" class="tiny">回り込み、旧分岐へ</text><rect class="room" x="294" y="355" width="128" height="70" rx="4"/><text x="357" y="395" text-anchor="middle" class="cap">設備室B</text><rect class="room" x="294" y="435" width="128" height="70" rx="4"/><text x="357" y="476" text-anchor="middle" class="cap">設備室A</text><path class="wall" d="M294 160 V375 M294 405 V455 M294 485 V568"/><path class="door" d="M294 375 Q310 390 294 405 M294 455 Q310 470 294 485"/><rect x="219" y="558" width="73" height="35" rx="4" fill="#426475" stroke="#a5bfca" stroke-width="2"/><text x="256" y="581" text-anchor="middle" class="tiny">南入口</text><path d="M16 618 H432" stroke="#4e6878"/><text x="16" y="643" class="tiny">制作者のみ：旧開口と想定経路を表示</text></g><g transform="translate(970 100)"><rect width="449" height="660" rx="16" fill="#1c2e3c" stroke="#476276" stroke-width="2"/><text x="22" y="41" class="head">区画・アクセスの検証条件</text><text x="22" y="87" class="cap">1. 西側壁は枝通路位置だけ開口</text><text x="22" y="123" class="cap">2. 正面壁と枝通路は別構造</text><text x="22" y="159" class="cap">3. 設備は開口を完全には塞がない</text><text x="22" y="195" class="cap">4. 通路の南側から設備を回り込む</text><text x="22" y="231" class="cap">5. 旧通路は旧倉庫扉へ接続</text><path d="M22 267 H427" stroke="#4e6878"/><text x="22" y="310" class="head">S08 と S09 の分離</text><text x="22" y="345" class="cap">S08: 設備陰の手前を指定するだけ</text><text x="22" y="378" class="cap">S09: 管理側の現場確認で経路判明</text><text x="22" y="411" class="cap">S10: 開放・救出は専門担当</text><path d="M22 448 H427" stroke="#4e6878"/><text x="22" y="485" class="head">未検証</text><text x="22" y="518" class="cap">設備の現物寸法と必要クリアランス</text><text x="22" y="549" class="cap">防災・安全・管理上の妥当性</text><text x="22" y="580" class="cap">直人が初回に気づいた経路</text><text x="22" y="611" class="cap">先行捜索で見逃された理由</text></g></svg>