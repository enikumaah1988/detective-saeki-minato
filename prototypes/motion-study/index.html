<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探偵 佐伯湊 — 演出試作01</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d14;color:#d5dce6;font-family:'Yu Gothic',Meiryo,sans-serif}main{width:min(1200px,94vw);margin:5vh auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:12px;letter-spacing:.18em;color:#9caabd}header strong{font-weight:400;color:#e1d0ab}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#020407;isolation:isolate;border:1px solid #29313b}.bg{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;filter:brightness(.34) saturate(.38);transform-origin:62% 45%}.night{position:absolute;inset:0;background:linear-gradient(110deg,#08132980,#09244448 65%,#01071280);mix-blend-mode:multiply}.light{position:absolute;inset:0;background:radial-gradient(ellipse at 34% 43%,#dfb77326,transparent 42%);opacity:0}.figure{position:absolute;height:112%;width:auto;bottom:-14%;right:0%;filter:brightness(.75) saturate(.7) drop-shadow(-12px 4px 15px #020711a0);opacity:0}.veil{position:absolute;inset:0;background:linear-gradient(90deg,#020711c9,transparent 75%),linear-gradient(0deg,#020711,transparent 40%)}.haze{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 73%,#9bacbf10,transparent 35%);pointer-events:none}.title{position:absolute;left:9%;top:37%;opacity:0;color:#f4e8ce;text-shadow:0 2px 18px #000}.title small{display:block;font:11px/1.4 sans-serif;letter-spacing:.42em;color:#bac5d5;margin-bottom:18px}.title h1{font-family:'Yu Mincho','MS Mincho',serif;font-weight:400;font-size:clamp(22px,4.5vw,60px);letter-spacing:.13em;margin:0;line-height:1.5}.title h1 span{display:block;font-size:.46em;letter-spacing:.5em;margin-bottom:4px}.rule{height:1px;width:64%;background:linear-gradient(90deg,#c3a36f,transparent);margin-top:24px}.black{position:absolute;inset:0;background:#020407;pointer-events:none}.letterbox:before,.letterbox:after{content:'';position:absolute;left:0;right:0;height:6%;background:#03060b;z-index:5}.letterbox:before{top:0}.letterbox:after{bottom:0}.start{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:6;background:#03070b40}.start p{font-size:12px;letter-spacing:.3em;color:#adb9ca}button{border:1px solid #556173;background:#121c2a;color:#e7e1d3;padding:12px 24px;cursor:pointer;font:inherit;font-size:13px;letter-spacing:.12em}button:hover{background:#253448}button:focus-visible{outline:2px solid #dbb778;outline-offset:4px}button:disabled{opacity:.4;cursor:default}.controls{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}.status{margin-left:auto;font-size:12px;color:#a9b7c8}.track{height:2px;background:#27313e;margin-top:16px}.track span{display:block;width:0;height:100%;background:#ba9e6e}.note{font-size:12px;line-height:1.9;color:#8a99ad;margin-top:20px}a{color:#cbb88c}[hidden]{display:none!important}@media(max-width:600px){main{margin:3vh auto}.controls button{padding:10px 14px}.status{margin-left:0;width:100%}.title small{font-size:8px;margin-bottom:8px}.rule{margin-top:10px}}
</style></head><body><main>
<header><strong>DIRECTION STUDY / 01</strong><span>12秒・無音</span></header>
<section class="stage letterbox" aria-label="夜の事務所で佐伯が現れ、タイトルが浮かぶ演出見本">
<img class="bg" src="assets/office-afternoon.png" alt="事務所の仮背景"><div class="night"></div><div class="light"></div><img class="figure" src="assets/minato-neutral.png" alt="佐伯湊の確認待ち立ち絵"><div class="haze"></div><div class="veil"></div>
<div class="title"><small>SAEKI MINATO</small><h1><span>探偵</span>佐伯 湊</h1><div class="rule"></div></div><div class="black"></div>
<div class="start"><div><p>夜の事務所 / 演出見本</p><button id="start" disabled>素材を読み込み中</button></div></div></section>
<div class="controls"><button id="replay" disabled>再再生</button><button id="skip" disabled>スキップ</button><span class="status" role="status" aria-live="polite">読み込み中</span></div><div class="track" aria-hidden="true"><span></span></div>
<p class="note">演出試作・本編未統合／物語として未確定。午後の既存背景を夜調にした仮素材、佐伯の個別立ち絵は採用確認待ち。音楽・SE・声なし。<a href="README.md">出典・演出タイミング・確認記録</a></p>
</main><script>
const $=s=>document.querySelector(s), duration=12000;
let frame=0, started=0, state='loading', elapsed=0;
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}, ramp=(t,a,b)=>ease((t-a)/(b-a));
function draw(t){const p=t/duration;$('.bg').style.transform=`translate(${-1.3*p}%,${.4*p}%) scale(${1+ .045*p})`;$('.figure').style.opacity=ramp(t,2700,5100);$('.figure').style.transform=`translateX(${(1-ramp(t,2700,6300))*24}px) scale(${1+.015*p})`;$('.light').style.opacity=ramp(t,1200,4500)*.8;$('.haze').style.transform=`translateX(${p*4}%)`;$('.title').style.opacity=ramp(t,6500,8700);$('.title').style.transform=`translateY(${(1-ramp(t,6500,8700))*10}px)`;$('.black').style.opacity=1-ramp(t,0,1700);$('.track span').style.width=`${p*100}%`;}
function finish(skipped=false){cancelAnimationFrame(frame);elapsed=duration;draw(duration);state=skipped?'skipped':'ended';$('.status').textContent=skipped?'スキップ完了 — 最終画面':'再生終了 — 12.0秒';$('#skip').disabled=true;}
function tick(now){elapsed=Math.min(duration,now-started);draw(elapsed);if(elapsed>=duration){finish();return}frame=requestAnimationFrame(tick)}
function play(){cancelAnimationFrame(frame);elapsed=0;state='playing';$('.start').hidden=true;$('#replay').disabled=false;$('#skip').disabled=false;$('.status').textContent='再生中 — 12秒';draw(0);started=performance.now();frame=requestAnimationFrame(tick)}
$('#start').onclick=play;$('#replay').onclick=play;$('#skip').onclick=()=>finish(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state==='playing')finish(true)});
Promise.all([...document.images].map(img=>img.decode())).then(()=>{state='ready';$('#start').disabled=false;$('#start').textContent='再生';$('.status').textContent='再生できます';draw(0)}).catch(()=>{$('.status').textContent='素材の読み込みに失敗しました。assetsフォルダを確認してください。';$('#start').textContent='読み込み失敗'});
// 読み取り専用の検証用状態。再生処理は実際のrequestAnimationFrameで検証する。
window.studyState=()=>({state,elapsed,duration});
</script></body></html>
